name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check services tests
      - name: Run service tests
        run: pytest -v tests/test_platform.py

  spark-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Spark image
        run: docker build -f Dockerfile.spark -t easm-spark:test .
      - name: Run graph tests in Spark image
        run: |
          docker run --rm --user root \
            -v "$PWD:/workspace" \
            -w /workspace \
            easm-spark:test \
            /bin/bash -lc 'export PYTHONPATH="/opt/spark/python:$(echo /opt/spark/python/lib/py4j-*-src.zip):/workspace/services";
              python3 -m pip install --no-cache-dir pytest pytest-asyncio >/dev/null &&
              python3 -m pytest -v tests/test_graph_resolution.py'
