[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easm-platform"
version = "0.2.0"
description = "Real-time event-driven EASM microservices and PySpark Delta lakehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "dnspython>=2.7.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "redis>=5.1.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
spark = [
    "delta-spark==4.0.1",
    "pyspark==4.0.1",
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
pythonpath = ["services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
