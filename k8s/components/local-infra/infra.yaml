apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: easm
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS gold_assets (
        asset_id TEXT PRIMARY KEY,
        tenant_id TEXT NOT NULL,
        fqdn TEXT NOT NULL,
        cluster_id TEXT,
        root_cause_node TEXT,
        latest_ips_json TEXT NOT NULL,
        is_shared_cdn BOOLEAN NOT NULL DEFAULT FALSE,
        detected_tech_json TEXT NOT NULL,
        tls_version TEXT,
        cert_sha256 TEXT,
        status TEXT NOT NULL,
        exposure_type TEXT,
        validation_tier TEXT NOT NULL,
        first_seen TEXT NOT NULL,
        last_seen TEXT NOT NULL
    );

    CREATE INDEX IF NOT EXISTS idx_gold_assets_tenant_status
        ON gold_assets (tenant_id, status);
    CREATE INDEX IF NOT EXISTS idx_gold_assets_cluster
        ON gold_assets (tenant_id, cluster_id);

    CREATE TABLE IF NOT EXISTS gold_asset_findings (
        asset_id TEXT NOT NULL,
        tenant_id TEXT NOT NULL,
        source TEXT NOT NULL,
        exposure_type TEXT NOT NULL,
        validation_tier TEXT NOT NULL,
        detected_at TEXT NOT NULL,
        PRIMARY KEY (asset_id, source, exposure_type)
    );

    CREATE TABLE IF NOT EXISTS gold_asset_edges (
        edge_id TEXT PRIMARY KEY,
        tenant_id TEXT NOT NULL,
        src_node TEXT NOT NULL,
        relation TEXT NOT NULL,
        dst_node TEXT NOT NULL,
        is_shared_infra BOOLEAN NOT NULL DEFAULT FALSE,
        observed_at TEXT NOT NULL
    );

    CREATE UNLOGGED TABLE IF NOT EXISTS gold_assets_staging (
        asset_id TEXT, tenant_id TEXT, fqdn TEXT, cluster_id TEXT,
        root_cause_node TEXT, latest_ips_json TEXT, is_shared_cdn BOOLEAN,
        detected_tech_json TEXT, tls_version TEXT, cert_sha256 TEXT,
        status TEXT, exposure_type TEXT, validation_tier TEXT, last_seen TEXT
    );
    CREATE UNLOGGED TABLE IF NOT EXISTS gold_asset_findings_staging (
        asset_id TEXT, tenant_id TEXT, source TEXT, exposure_type TEXT,
        validation_tier TEXT, detected_at TEXT
    );
    CREATE UNLOGGED TABLE IF NOT EXISTS gold_asset_sources_staging (
        asset_id TEXT, source TEXT, has_finding BOOLEAN
    );
    CREATE UNLOGGED TABLE IF NOT EXISTS gold_asset_edges_staging (
        edge_id TEXT, tenant_id TEXT, src_node TEXT, relation TEXT,
        dst_node TEXT, is_shared_infra BOOLEAN, observed_at TEXT
    );
    CREATE UNLOGGED TABLE IF NOT EXISTS gold_asset_clusters_staging (
        asset_id TEXT, tenant_id TEXT, fqdn TEXT, cluster_id TEXT,
        root_cause_node TEXT
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.1
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.easm.svc.cluster.local:9092
          ports:
            - containerPort: 9092
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: easm
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --save
            - "60 1"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: easm
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: easm
            - name: POSTGRES_USER
              value: easm
            - name: POSTGRES_PASSWORD
              value: easm_pass
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: easm
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
