apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: easm

resources:
  - namespace.yaml
  - apps.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: easm-observability-config
    literals:
      - OBSERVABILITY_MODE=debug
      - LOG_LEVEL=INFO
      - METRICS_PORT=9108
      - OFFLINE_MODE=true
