apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-scheduler
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-scheduler
  template:
    metadata:
      labels:
        app: discovery-scheduler
    spec:
      containers:
        - name: scheduler
          image: easm-services:local
          imagePullPolicy: Never
          command:
            - uvicorn
            - discovery_scheduler.app:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: OFFLINE_MODE
              value: "true"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-scheduler
  namespace: easm
spec:
  selector:
    app: discovery-scheduler
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-worker
  namespace: easm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: probe-worker
  template:
    metadata:
      labels:
        app: probe-worker
    spec:
      containers:
        - name: worker
          image: easm-services:local
          imagePullPolicy: Never
          command: ["python", "-m", "probe_worker.worker"]
          env:
            - name: OFFLINE_MODE
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-api
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-api
  template:
    metadata:
      labels:
        app: asset-api
    spec:
      containers:
        - name: api
          image: easm-services:local
          imagePullPolicy: Never
          command:
            - uvicorn
            - asset_api.app:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: asset-api
  namespace: easm
spec:
  selector:
    app: asset-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-stream-processor
  namespace: easm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-stream-processor
  template:
    metadata:
      labels:
        app: spark-stream-processor
    spec:
      securityContext:
        fsGroup: 185
      containers:
        - name: spark-driver
          image: easm-spark:local
          imagePullPolicy: Never
          command:
            - /opt/spark/bin/spark-submit
            - --master=local[2]
            - --packages=io.delta:delta-spark_2.13:4.0.1,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,org.postgresql:postgresql:42.7.4
            - /opt/spark/work-dir/stream_job.py
          volumeMounts:
            - name: lakehouse
              mountPath: /mnt/lakehouse
      volumes:
        - name: lakehouse
          persistentVolumeClaim:
            claimName: lakehouse-pvc
